name: CI

# Runs on the promotion of `dev` to `main`, on a pull request targeting
# `main`, and on manual dispatch. Day-to-day pushes to `dev` do not trigger
# CI -- pre-flight a promotion by running this workflow against `dev` from
# the Actions tab (or `gh workflow run ci.yml --ref dev`) and waiting for
# green before you fast-forward `dev` onto `main`. The `pull_request`
# trigger exists so the occasional gated PR into `main` still gets a check;
# with no PR open, ordinary `dev` work stays CI-free.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: check-all (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v3
      - run: just check-all

  features:
    name: check-features (ubuntu-latest)
    # Feature-powerset compile check -- every combination of cli/creusot/
    # verus across the workspace. Linux-only; the Windows job already
    # covers the #[cfg(windows)] surface, and doubling the powerset onto
    # a Windows runner isn't worth it. Separate from `check-all` so a
    # feature-gate break and a fmt/clippy/test break report independently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: extractions/setup-just@v3
      - run: just check-features

  cordial:
    name: cordial-gate (ubuntu-latest)
    # Quality-etiquette gate: fails if any curated action item is open
    # (`cordial quality --deny-open`, gating `quality-report.md`'s "Total
    # open items"). The `cordial` binary is pinned to a commit and cached
    # by that key -- it only rebuilds when CORDIAL_REV changes.
    # `creusot_diagnostics` is disabled in cordial.toml (needs the Creusot
    # toolchain); the `verify-creusot` recipe covers that surface locally.
    runs-on: ubuntu-latest
    env:
      # crumplecup/cordial -- bump when a cordial change is needed here.
      CORDIAL_REV: bc0fc3f09a78b69cdf026335ecc52a1441850e1c
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - name: Cache cordial binary
        id: cordial-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cordial
          key: cordial-${{ env.CORDIAL_REV }}
      - name: Install cordial
        if: steps.cordial-cache.outputs.cache-hit != 'true'
        run: >
          cargo install --git https://github.com/crumplecup/cordial
          --rev ${{ env.CORDIAL_REV }} --locked
          --no-default-features --features quality,cli cordial
      - run: just cordial-gate

  windows:
    name: check-all (windows-latest)
    # Kani/CBMC don't run on Windows, so this validates the #[cfg(windows)]
    # registrations in amenable_std/rust_std/os_windows.rs for real (native
    # compile + clippy + test, not the cross/Podman check in the justfile's
    # check-windows recipe) -- everything except the actual Kani proofs,
    # which stay Linux-only and reference an accommodation model instead
    # (see amenable_kani/src/os_windows_model.rs).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v3
      - run: just check-all
      # Dumped only to confirm, for real, that a #[cfg(windows)] EvidenceLink
      # (amenable_std) and its hand-wired kani ProofRecord (amenable_kani,
      # cross-platform) both land in the same registry when built on the
      # target platform -- the actual mechanism os_windows_model.rs's doc
      # comment claims, not just the compile check above.
      - run: cargo run -p amenable --bin amenable -- dump-registry --out registry-dump-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: registry-dump-windows
          path: registry-dump-windows.json
