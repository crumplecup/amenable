[workspace]
members = [
  "crates/amenable",
  "crates/amenable_core",
  "crates/amenable_derive",
  "crates/amenable_gaap",
  "crates/amenable_std",
  "crates/amenable_kani",
  "crates/amenable_creusot",
  "crates/amenable_verus",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/crumplecup/amenable"
authors = ["Erik Rose <erik.w.rose@gmail.com>"]
homepage = "https://github.com/crumplecup/amenable"
documentation = "https://docs.rs/amenable"

[workspace.dependencies]
amenable = { path = "crates/amenable", version = "0.1.0" }
amenable_core = { path = "crates/amenable_core", version = "0.1.0" }
amenable_derive = { path = "crates/amenable_derive", version = "0.1.0" }
amenable_gaap = { path = "crates/amenable_gaap", version = "0.1.0" }
amenable_std = { path = "crates/amenable_std", version = "0.1.0" }
amenable_kani = { path = "crates/amenable_kani", version = "0.1.0" }
amenable_creusot = { path = "crates/amenable_creusot", version = "0.1.0" }
amenable_verus = { path = "crates/amenable_verus", version = "0.1.0" }

clap = { version = "4", features = ["derive"] }
creusot-std = { version = "0.11.0", features = ["sc-drf"] }
derive-getters = "0.5"
derive-new = "0.7"
derive_builder = "0.20"
derive_more = { version = "2", features = ["as_ref", "display", "error", "from"] }
derive_setters = "0.1"
inventory = "0.3"
miette = { version = "7", features = ["fancy"] }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
syn = { version = "3", features = ["full"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
uuid = "1"
verus_builtin_macros = "0.0.0-2026-05-31-0205"
verus_syn = "0.0.0-2026-08-02-0125"
vstd = "0.0.0-2026-05-31-0205"

# No [workspace.lints.rust] unexpected_cfgs here: a workspace-wide union
# list was tried and reverted -- it let a verifier's cfg name go
# "expected" in every crate, not just its own (e.g. an accidental
# `#[cfg(creusot)]` copy-pasted into `amenable_kani` would silently pass,
# since `creusot` was declared expected workspace-wide). Cargo doesn't
# allow `[lints] workspace = true` (needed for the shared clippy list
# below) to coexist with a crate-local `[lints.rust]` override in the
# same manifest, so each crate that has its own real cfg names declares
# them via a small `build.rs` (`cargo::rustc-check-cfg=cfg(name)`)
# instead -- independent of the `[lints]` table entirely, so `workspace
# = true` and a crate-scoped check-cfg list both hold at once. Verified
# empirically per crate (`cargo clippy` with an empty check-cfg list,
# reading exactly which crate/file/name each real warning named) rather
# than assumed from the old list: `verus`/`verus_verify_core` turned out
# to be declared but never actually used anywhere in the workspace, and
# `amenable_gaap` turned out to need `kani` even though it wasn't on the
# old list at all.

# Stricter-than-default clippy config, per
# https://emschwartz.me/your-clippy-config-should-be-stricter/ -- selective
# opt-in of specific lints, not the blanket `pedantic`/`restriction` groups,
# matching this repo's own "never #[allow], fix the root cause" policy
# (CLAUDE.md). Every lint here is a real "warn" under this workspace's
# existing `-D warnings` clippy gate, so a lint enabled here is enforced,
# not aspirational.
[workspace.lints.clippy]
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
# Left off after a real recon pass: every one of the 65 hits was in
# amenable_verus's rust_std carrier corpus, indexing a small fixed-size
# array/slice (`arr[0]`, `v[1]`) whose length is a compile-time literal,
# not runtime-variable -- `.get(n)` there just relocates the panic
# without adding real safety, at real ceremony cost. Revisit if this
# codebase starts indexing variable-length/untrusted data.
# indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Left off after a real recon pass: every `unreachable!()` clippy can
# actually see (all others are either behind #[cfg(kani)], invisible to
# clippy the same way expect_used's Kani harnesses are, or inside
# amenable_derive's own quote!{} codegen templates, not real source at
# the definition site) is amenable_verus's own `#[cfg(verus_keep_ghost)]
# Ok(_) => unreached() / #[cfg(not(verus_keep_ghost))] Ok(_) =>
# unreachable!()` split: the real, SMT-proven branch under the real
# `verus` toolchain, with `unreachable!()` only the plain-rustc fallback
# `unreached()` needs vstd to avoid. cordial's panics etiquette now
# detects this exact ghost/exec pairing and exempts it structurally
# (verus_ir::VerusPanicSite::proven_unreachable_by_ghost_sibling), while
# still flagging any other `unreachable!()` as an open checklist item --
# cordial is the enforcement mechanism for this lint going forward, not
# clippy's blanket restriction. Not yet wired into CI; until it is, this
# category has no automated gate.
# unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
# Left off after a real recon pass: 359 of ~910 total warnings, and every
# sampled hit was `assert!`/`assert_eq!` inside `#[test] fn foo() ->
# miette::Result<()> { ..; Ok(()) }` -- this workspace's own standard
# test idiom (CLAUDE.md: tests live in `tests/`, use `?` for setup,
# assert macros for the actual check). This lint exists to catch a
# library function panicking instead of propagating `Result` to its
# caller; it fires on the opposite case here. Unlike cordial (which can
# discriminate test vs lib code directly), clippy has no config knob
# that scopes this lint by context, only a blanket enable/disable.
# panic_in_result_fn = "warn"
# Left off on purpose: amenable_kani's proof harnesses use .expect(..) on
# symbolic Kani values deliberately, not as a shortcut.
# expect_used = "warn"
# Left off after a real recon pass: 117 hits, sampled two dozen -- all
# loop counters (`i += 1`), UTF-8 continuation-byte decode math in Kani
# model code, and small literal offsets in test fixtures (`a + 10`).
# Matches this lint's own well-known ~85% false-positive rate; no
# evidence of real overflow/underflow risk on untrusted input here.
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
# Left off after a real recon pass: all 7 hits were `let _ = ...;`
# discarding a Result whose "why is this safe to discard" reasoning was
# already sitting right next to it -- a Verus `ensures result` clause
# stating the outcome is irrelevant by design, a doc comment already
# saying "install once per test process" (repeat-call failure expected
# and fine), the true outermost main() error-reporting boundary with
# nowhere further to propagate to, and a standard best-effort test
# tempfile cleanup. Renaming `let _ =` to `let _named =` at each site
# (clippy's own escape hatch) added no real information -- same
# lint-shape-only substance objection as the unwrap-to-expect mistake
# this session already corrected once.
# let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Real recon pass (not the article's own "optional" hedge): 2 total hits
# workspace-wide, 0 for cast_possible_wrap -- nothing close to the
# hundreds-of-hits false-positive profile the other disabled lints in
# this file have. Both were real: os_windows_model.rs's
# kani_encode_wide_bmp_char had an undocumented-in-the-type-system BMP
# precondition backed only by a caller's kani::assume, and
# assessment.rs's mean calculation cast a u32 sum/usize len to f64 with
# no stated bound. Both fixed with real try_from/From conversions
# instead of `as`, not suppressed.
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints
# `allow_attributes` itself left off: cordial's own antipatterns scanner
# is the better-fitted tool for policing whether an `#[allow]` should
# exist at all (it already understands proc-macro-ABI/Creusot-opaque-
# stub/cfg-sibling exemptions cordial-side, which clippy has no way to
# express) -- confirmed by a real recon pass that every one of 145 hits
# was the same `#[allow(unused_imports)]` above `use vstd::prelude::*;`
# across amenable_verus/src/{rust_std,gallery,derived_witness}/*.rs,
# genuinely necessary (amenable_verus compiles under plain stable by
# design, `verus! { .. }` expanding to inert plain Rust with all real
# spec content erased; the import only matters when the same source is
# fed to the real `verus` binary directly, which never resolves
# Cargo.toml/sets a custom --cfg the way `cargo kani`/`cargo creusot` do,
# so there's no structural gate available). `allow_attributes_without_
# reason` stays on: it costs nothing to document *why* each of those
# `#[allow]`s exists at its own site, and every one of the 145 (146
# counting fp_category_carrier.rs's second import) now does.
# allow_attributes = "warn"
allow_attributes_without_reason = "warn"
