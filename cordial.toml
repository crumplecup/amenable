# cordial workspace config for amenable.
#
# [tracing] apply_gate_crates / apply_skip_crates -- real, empirically
# verified per-crate policy for cordial's tracing `--apply` (see
# docs/CFG_HYGIENE_PLAN.md's Step 3 for the full evidence trail):
#
# - amenable_kani: `#[instrument]` reachable from a `#[kani::proof]`
#   harness causes real CBMC symbolic-closure-capture timeouts (real
#   gallery evidence, ~/repos/elicitation's KANI_FOR_VSMS.md sec 6.3:
#   gallery14a_ungated_debug hangs, gallery14b_gated_debug completes
#   ~8s gated). `cargo kani`'s `--cfg kani` applies to kani's whole
#   dependency graph, so gating must propagate transitively -- any
#   crate amenable_kani depends on (e.g. amenable_core, amenable_gaap)
#   needs the same gate even though it isn't itself listed here.
#
# - amenable_creusot: a bare `#[instrument]` hard-fails Creusot's
#   translator -- `creusot_std::model::DeepModel` isn't implemented for
#   `tracing::Level`/`LevelFilter`, so `creusot-rustc` fatals on the
#   static `DefaultCallsite` reference `tracing::span!` embeds
#   (confirmed via a real `cargo creusot` run). This is crate-wide, not
#   scoped to generated companions only.
#
# - amenable_verus: `verus --crate-type=lib` never reads `Cargo.toml`
#   at all, so it can't resolve the `tracing` crate under any cfg.
#
# Skip does not propagate through the ordinary Cargo dependency graph
# (a translator that only sweeps a crate's own local items, real
# precedent: creusot-rustc, has no reason to touch an ordinary
# dependency's source at all) but does propagate through a `#[path]`
# splice, since that's a second, distinct compilation of the same file
# text under the splicing crate's own rules.
#
# No config knob for Ensures/Requires: cordial now finds them itself.
# Any function whose every real caller, transitively, bottoms out in a
# proof-only entry point (a function nested in one of the cfg names
# above) is never recorded as needing #[instrument] at all --
# workspace-wide call-graph reachability, not a hardcoded trait name,
# so it covers amenable_core::Ensures/Requires impls (confirmed:
# their own doc comment says ensures() "is the real check, called
# directly at the proof site") without naming them specifically, and
# keeps working if this workspace grows other proof-only helpers later.

[tracing]
apply_gate_crates = { amenable_kani = "kani" }
apply_skip_crates = ["amenable_creusot", "amenable_verus"]
# extra_skip -- large-buffer parameter names this workspace uses that
# cordial's own built-in DEFAULT_SKIP_PARAMS list (generic, cordial-repo-
# scoped) doesn't cover: `payload`/`bytes` (real byte buffers, e.g.
# amenable_kani::net_model's modeled TCP/UDP writes) and `body` (String/
# &str content, e.g. rendered report text). Recorded per real occurrence
# in this workspace, confirmed via grep before adding -- not a guess.
extra_skip = ["payload", "bytes", "body"]

# [tracing.subscriber] known_helper_paths -- amenable_core::init_tracing is
# the one shared subscriber-install helper every test-bearing crate in the
# family (amenable_core itself, amenable_derive, amenable_gaap,
# amenable_std, amenable) can reach without a workspace re-export cycle
# (see amenable_core::tracing_init's own doc comment for why it lives
# there, not in the amenable facade). A crate-local scan can never see a
# cross-crate helper's own body, so without this it's invisible: every
# main/#[test] calling it would be wrongly flagged as never installing a
# subscriber. amenable's own tests/main.rs call the facade re-export
# (`amenable::init_tracing`) instead -- both count.
[tracing.subscriber]
known_helper_paths = ["amenable_core::init_tracing", "amenable::init_tracing"]

# [cfg_hygiene] crate_verifier -- each verifier backend crate's own real
# cfg identity. CFG-VERIFIER-MISMATCH-001 only checks these three crates
# (opt-in, per docs/CFG_HYGIENE_PLAN.md Step 2): does each one's own
# source ever use a *different* verifier's cfg name than its own? This is
# the real gap a workspace-wide check-cfg union created and could never
# self-detect (a misplaced #[cfg(creusot)] landing in amenable_kani was
# invisible to rustc under the old config). Deliberately doesn't list
# amenable_core/amenable_gaap/amenable -- those legitimately reference
# more than one verifier's cfg name, since a verifier's --cfg reaches its
# whole compiled dependency graph, not just the backend crate itself.
[cfg_hygiene]
crate_verifier = { amenable_kani = "kani", amenable_creusot = "creusot", amenable_verus = "verus" }

# [modularity] generated_files -- exempt from MODULARITY-FILE and
# MODULARITY-MODULE-SIZE (not MODULARITY-TYPES-PER-FILE or
# MODULARITY-FUNCTION, which stay live even inside these directories).
# Paths are crate-relative; verified by tracing each `amenable emit-*`
# command in crates/amenable/src/{verus_export,creusot_export,
# verus_exchange_export,verus_gaap_tokens_export,paths}.rs to its actual
# write target, not inferred from file size or name:
#
# - amenable_verus/src/derived_witness/ -- `emit-verus-witnesses`
#   (write_verus_witness_modules). Already known the hard way to be
#   fully regenerated, never hand-edit (a prior hand-edit was silently
#   reverted by the very next `just verify-verus` run).
# - amenable_creusot/src/generated/ -- `emit-creusot-companions`
#   (write_creusot_exchange_companions), one file per Exchange method.
# - amenable_verus/src/gallery/generated/ -- `emit-verus-exchange-
#   companions` (write_verus_exchange_companions, one subdirectory per
#   self_ty group) and `emit-verus-gaap-tokens`
#   (write_verus_gaap_token_companion, the single `ledger_tokens.rs`),
#   both writing into the same parent directory.
#
# Deliberately NOT listed: amenable_std/src/verus_witness.rs,
# amenable_creusot/src/{rust_std_witness,rust_std}.rs. All three are
# large but hand-written -- no `emit-*` command writes to any of them,
# and their doc comments are ordinary human design-rationale prose, not
# templated output. Listing them anyway would hide real modularity
# signal on real hand-maintained files.
[modularity]
generated_files = [
    "src/derived_witness",
    "src/generated",
    "src/gallery/generated",
]

# Disabled by explicit request, not a false-positive/tooling-gap finding
# like the other exceptions in this file.
[proof_patterns]
enabled = false
