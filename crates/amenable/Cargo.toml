[package]
name = "amenable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true

description = "Constitutional trait family for lawful proof-carrying software structure"
keywords = ["formal-verification", "proof", "provenance", "constitutional", "audit"]
categories = ["development-tools", "rust-patterns"]

[dependencies]
amenable_core = { workspace = true }
amenable_std = { workspace = true }
amenable_kani = { workspace = true }
amenable_creusot = { workspace = true }
amenable_verus = { workspace = true }
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2", features = ["display", "error", "from"] }
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }

[dependencies.miette]
version = "7"
features = ["fancy"]
optional = true

[dev-dependencies.miette]
version = "7"
features = ["fancy"]

[features]
default = ["cli"]
cli = ["dep:miette"]
