[package]
name = "amenable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "Constitutional trait family for lawful proof-carrying software structure"
keywords = ["formal-verification", "proof", "provenance", "constitutional", "audit"]
categories = ["development-tools", "rust-patterns"]

[[bin]]
name = "amenable"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
amenable_core = { workspace = true }
amenable_std = { workspace = true }
amenable_kani = { workspace = true }
amenable_creusot = { workspace = true, optional = true }
clap = { workspace = true }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_builder = { workspace = true }
derive_more = { workspace = true }
derive_setters = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dependencies.miette]
workspace = true
optional = true

[dev-dependencies.miette]
workspace = true

[features]
default = ["cli"]
cli = ["dep:miette"]
# `amenable_creusot` is an experimental, still-partial verifier backend,
# kept out of the default proof-chain surface until it's more complete --
# not because it needs anything special to compile (plain stable `cargo
# check --features creusot` works fine). `dump-registry`'s output only
# includes Creusot's registered ProofRecords when this feature is on.
# No `amenable_std/creusot` here anymore either: `amenable_std`'s own
# `Witness<CreusotVerifier>` bridge for `RustStdStandard<T>` moved to
# `amenable_creusot::rust_std_witness` (a real, ordinary, unconditional
# dependency `amenable_creusot -> amenable_std` now, no feature needed on
# that side) -- see that module's own doc comment for why: the old
# `amenable_std -> amenable_creusot` optional edge closed a real Cargo
# cycle the moment `amenable_creusot` also wanted to depend on
# `amenable_kani` (which depends on `amenable_std` unconditionally).
# `amenable`'s own binary linking both `amenable_kani` and
# `amenable_creusot` (via `dep:amenable_creusot` below) is what makes
# each backend's own registrations visible to `Amenable::*_surface()`
# queries at runtime -- inventory needs no Cargo edge between verifier
# backend crates themselves, only both being linked into the same final
# binary (see `amenable_creusot::stoplight`'s own `#[cfg(not(creusot))]`
# -gated `ProofRecord` registrations for the precedent this follows).
creusot = ["dep:amenable_creusot"]
# `amenable_verus` itself is never a Cargo dependency of anything (see
# `amenable_std::verus_witness`'s own doc comment for why: Verus never
# resolves `Cargo.toml`, so there's no witness/registry machinery to
# depend on there at all) -- this only toggles `amenable_std/verus`, which
# `include_str!`s `amenable_verus`'s real proof source by relative path.
verus = ["amenable_std/verus"]

[lints]
workspace = true
