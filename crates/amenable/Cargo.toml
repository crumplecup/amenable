[package]
name = "amenable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "Constitutional trait family for lawful proof-carrying software structure"
keywords = ["formal-verification", "proof", "provenance", "constitutional", "audit"]
categories = ["development-tools", "rust-patterns"]

[[bin]]
name = "amenable"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
amenable_core = { workspace = true }
amenable_std = { workspace = true }
amenable_kani = { workspace = true }
amenable_creusot = { workspace = true, optional = true }
clap = { workspace = true }
derive_more = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[dependencies.miette]
workspace = true
optional = true

[dev-dependencies.miette]
workspace = true

[features]
default = ["cli"]
cli = ["dep:miette"]
# `amenable_creusot` (and the Creusot side of `amenable_std`) is an
# experimental, still-partial verifier backend, kept out of the default
# proof-chain surface until it's more complete -- not because it needs
# anything special to compile (plain stable `cargo check --features
# creusot` works fine). `dump-registry`'s output only includes Creusot's
# registered ProofRecords when this feature is on. No `amenable_kani/
# creusot` here anymore -- that feature (and the `amenable_kani ->
# amenable_creusot` Cargo dependency it gated) was a real violation of
# "verifier backend crates never depend on each other," fixed by having
# `amenable_creusot::stoplight` register its own `ProofRecord`s (`#[cfg(
# not(creusot))]`-gated) for `Stoplight::creusot_surface()` to query via
# the shared registry instead. `amenable`'s own binary linking both
# `amenable_kani` and `amenable_creusot` (via `dep:amenable_creusot`
# below) is what makes those registrations visible to that query at
# runtime -- inventory needs no Cargo edge between the two crates
# themselves, only both being linked into the same final binary.
creusot = ["dep:amenable_creusot", "amenable_std/creusot"]
# `amenable_verus` itself is never a Cargo dependency of anything (see
# `amenable_std::verus_witness`'s own doc comment for why: Verus never
# resolves `Cargo.toml`, so there's no witness/registry machinery to
# depend on there at all) -- this only toggles `amenable_std/verus`, which
# `include_str!`s `amenable_verus`'s real proof source by relative path.
verus = ["amenable_std/verus"]
