[package]
name = "amenable_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "Constitutional trait family for lawful proof-carrying software structure"
keywords = ["formal-verification", "proof", "provenance", "constitutional", "audit"]
categories = ["development-tools", "rust-patterns"]

[dependencies]
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_more = { workspace = true }
inventory = { workspace = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
verus_syn = { workspace = true, optional = true }

[dev-dependencies]
amenable_derive = { workspace = true }
miette = { workspace = true }
trybuild = { workspace = true }

[features]
# `verus_carrier` parses real Verus carrier source with `verus_syn` --
# kept optional since most consumers of this crate have nothing to do
# with Verus and shouldn't pull that dependency in unconditionally.
# Shared here (not in `amenable_derive`, a proc-macro crate that cannot
# export anything but macro items) so `amenable_derive`'s compile-time
# fragment macros and `amenable_std`'s runtime VerusCallShape derivation
# both call the same one implementation.
verus = ["dep:proc-macro2", "dep:quote", "dep:syn", "dep:verus_syn"]

[lints]
workspace = true
