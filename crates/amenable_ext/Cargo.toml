[package]
name = "amenable_ext"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "Third-party crate support for the amenable trait family: Evidence/Witness for foreign types, one crate per target behind a same-named feature flag"
keywords = ["formal-verification", "proof", "provenance"]
categories = ["development-tools"]

[dependencies]
amenable_core = { workspace = true }
amenable_derive = { workspace = true }
# Optional: only pulled in by a target feature that needs the temporal
# contract interface (jiff, later chrono) -- see docs/AMENABLE_EXT_PLAN.md's
# "Relationship to amenable_time". Not pulled in by non-temporal targets
# (uuid, when it lands).
amenable_time = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_more = { workspace = true }
inventory = { workspace = true }
# Optional, gated by the `jiff` feature below.
jiff = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
miette = { workspace = true }

[features]
default = []
# All jiff features are on for the same coverage reason as chrono below
# (cordial's shadow-dep build inventories the full public surface).
jiff = [
    "dep:jiff",
    "dep:amenable_time",
    "jiff/serde",
    "jiff/defmt",
    "jiff/logging",
    "jiff/js",
    "jiff/static",
    "jiff/tzdb-bundle-always",
]
# All chrono and chrono-tz features are on so cordial's shadow-dep build
# inventories the full public surface, not one feature set's slice of it.
# rkyv: only the default 32-bit size variant, since rkyv's size_* features
# are mutually exclusive.
chrono = [
    "dep:chrono",
    "chrono/serde",
    "chrono/defmt",
    "chrono/unstable-locales",
    "chrono/rkyv",
    "chrono/rkyv-validation",
]
chrono-tz = [
    "chrono",
    "dep:chrono-tz",
    "chrono-tz/serde",
    "chrono-tz/case-insensitive",
    "chrono-tz/filter-by-regex",
]
# The Witness<VerusVerifier> bridge for every target's ExtStandard<T>
# (src/jiff/verus_witness.rs and siblings) -- off by default like every
# other verifier feature in this workspace.
verus = ["amenable_core/verus", "amenable_derive/verus"]

[lints]
workspace = true
