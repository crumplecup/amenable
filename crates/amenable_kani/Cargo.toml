[package]
name = "amenable_kani"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "Kani verifier backend for the amenable constitutional trait family"
keywords = ["formal-verification", "kani", "proof"]
categories = ["development-tools"]

[dependencies]
amenable_core = { workspace = true }
amenable_derive = { workspace = true }
# Optional: only pulled in by a target feature that needs it (jiff so
# far) -- see docs/AMENABLE_EXT_PLAN.md.
amenable_ext = { workspace = true, optional = true }
amenable_gaap = { workspace = true }
amenable_std = { workspace = true }
amenable_time = { workspace = true }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_builder = { workspace = true }
derive_more = { workspace = true }
derive_setters = { workspace = true }
inventory = { workspace = true }
# Optional, gated by the `jiff` feature below.
jiff = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
miette = { workspace = true }

[features]
default = []
jiff = ["dep:amenable_ext", "amenable_ext/jiff", "dep:jiff"]

[lints]
workspace = true
