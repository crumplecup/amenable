[package]
name = "amenable_std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "RustStdType: interface and concrete registrations for Rust standard-library types"
keywords = ["formal-verification", "proof", "std", "provenance"]
categories = ["development-tools", "rust-patterns"]

[dependencies]
amenable_core = { workspace = true }
amenable_creusot = { workspace = true, optional = true }
amenable_derive = { workspace = true }
inventory = { workspace = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
verus_syn = { workspace = true, optional = true }

[features]
# See `amenable`'s own `creusot` feature for the full rationale: an
# experimental, still-partial backend, kept optional rather than pulled in
# unconditionally by every crate that depends on `amenable_std` (which is
# all of them).
creusot = ["dep:amenable_creusot"]
# No `dep:amenable_verus` here, unlike `creusot` above: `amenable_verus` is
# a standalone crate Verus compiles directly (no `amenable_core`/
# `inventory` dependency at all — Verus never sees `Cargo.toml`, so it
# can't resolve either), so there is nothing for `amenable_std` to depend
# on as an ordinary Cargo edge. `verus_witness` instead `include_str!`s
# `amenable_verus`'s real proof source files by relative path — a
# real, if informal, coupling (this build breaks if those files move),
# which is exactly why this stays gated behind a feature like `creusot`
# rather than being unconditional. `syn`/`verus_syn`/`quote` back
# `verus_call_shape_derive`, which reads those same real source files at
# runtime (relative to `CARGO_MANIFEST_DIR`, the same resolution
# `amenable::paths::verus_source_directory` already uses) and parses them
# with Verus's own real parser, rather than a human hand-typing a second
# copy of each harness's real `requires`/`ensures` clauses.
verus = [
  "amenable_core/verus",
  "amenable_derive/verus",
  "dep:proc-macro2",
  "dep:quote",
  "dep:syn",
  "dep:verus_syn",
]
