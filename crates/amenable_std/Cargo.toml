[package]
name = "amenable_std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "RustStdType: interface and concrete registrations for Rust standard-library types"
keywords = ["formal-verification", "proof", "std", "provenance"]
categories = ["development-tools", "rust-patterns"]

[dependencies]
amenable_core = { workspace = true }
amenable_derive = { workspace = true }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_builder = { workspace = true }
derive_more = { workspace = true }
inventory = { workspace = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
tracing = { workspace = true }
verus_syn = { workspace = true, optional = true }

[dev-dependencies]
miette = { workspace = true }

[features]
# No `creusot` feature here anymore: this crate's own `Witness<
# CreusotVerifier>` bridge for `RustStdStandard<T>` used to live here,
# gated behind this feature, with an optional dependency forward into
# `amenable_creusot` (needed only to name `CreusotVerifier`, the trait's
# own type parameter). That edge closed a real Cargo cycle the moment
# anything wanted `amenable_creusot` to also depend on `amenable_kani`
# (which depends on this crate unconditionally) -- confirmed directly by
# a real `cyclic package dependency` error, not assumed. Moved to
# `amenable_creusot::rust_std_witness` instead, which now takes a real,
# ordinary, unconditional dependency *on* this crate and implements the
# bridge from that side -- see that module's own doc comment for the
# full story and why it's legal/safe (`creusot-rustc`'s translator only
# sweeps items local to the crate it's directly translating, not an
# ordinary dependency's own items).
# No `dep:amenable_verus` here: `amenable_verus` is a standalone crate
# Verus compiles directly (no `amenable_core`/`inventory` dependency at
# all — Verus never sees `Cargo.toml`, so it can't resolve either), so
# there is nothing for `amenable_std` to depend on as an ordinary Cargo
# edge. `verus_witness` instead `include_str!`s `amenable_verus`'s real
# proof source files by relative path — a real, if informal, coupling
# (this build breaks if those files move), which is exactly why this
# stays gated behind a feature rather than being unconditional.
# `syn`/`verus_syn`/`quote` back
# `verus_call_shape_derive`, which reads those same real source files at
# runtime (relative to `CARGO_MANIFEST_DIR`, the same resolution
# `amenable::paths::verus_source_directory` already uses) and parses them
# with Verus's own real parser, rather than a human hand-typing a second
# copy of each harness's real `requires`/`ensures` clauses.
verus = [
  "amenable_core/verus",
  "amenable_derive/verus",
  "dep:proc-macro2",
  "dep:quote",
  "dep:syn",
  "dep:verus_syn",
]

[lints]
workspace = true
