[package]
name = "amenable_time"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

description = "Temporal contract interface: standards-anchored date, time, offset, and timestamp propositions expressed as amenable Standards and Exchanges"
keywords = ["formal-verification", "proof", "time", "temporal", "provenance"]
categories = ["date-and-time", "development-tools"]

[dependencies]
amenable_core = { workspace = true }
amenable_derive = { workspace = true }
derive_builder = { workspace = true }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_more = { workspace = true }
inventory = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
miette = { workspace = true }

[features]
# Turns on the Verus-side `Witness<VerusVerifier>` impls for the
# genuinely-checkable temporal contracts (`src/verus_witness.rs`), which
# name `amenable_core::VerusVerifier` — itself `#[cfg(feature = "verus")]`.
# Off by default (an experimental, still-partial verifier backend); the
# real `verus! { .. }` proof content lives in `amenable_verus`.
verus = ["amenable_core/verus"]

[lints]
workspace = true
